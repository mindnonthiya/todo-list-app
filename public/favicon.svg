<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Premium Soothing Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="60%" stop-color="#ee4040"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </linearGradient>
    
    <!-- Subtle Inner Gloss -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5f5"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#ee4040" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#logoBg)" filter="url(#softGlow)"/>
  
  <!-- Subtle Highlight Border -->
  <rect x="3.5" y="3.5" width="41" height="41" rx="12.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" fill="none"/>

  <!-- Left Accent Task Tile -->
  <rect x="11" y="13" width="8" height="22" rx="4" fill="url(#tileGrad)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Right Floating Task Card -->
  <rect x="22" y="13" width="15" height="22" rx="4" fill="url(#tileGrad)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Precision Checkmark Crest -->
  <path d="M14 24.5 L20.5 31 L34 16.5" stroke="url(#checkStroke)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
