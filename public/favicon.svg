<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Highlight Edge -->
  <rect x="3" y="3" width="42" height="42" rx="11" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Geometric Layered Planner Bars -->
  <rect x="12" y="14" width="24" height="4.5" rx="2.25" fill="url(#barGrad1)"/>
  <rect x="12" y="22" width="18" height="4.5" rx="2.25" fill="url(#barGrad2)"/>
  <rect x="12" y="30" width="12" height="4.5" rx="2.25" fill="url(#barGrad2)"/>

  <!-- Prominent Dynamic Checkmark Crest -->
  <path d="M22 31.5 L28.5 37.5 L40 18" fill="none" stroke="url(#checkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
